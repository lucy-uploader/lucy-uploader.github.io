<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Lucy Uploader - Authorization</title></head>
<body>
<h1>Lucy Uploader</h1>
<p id="msg">Reading the authorization code...</p>
<pre id="code" style="font-size:20px;white-space:pre-wrap;word-break:break-all;"></pre>
<script>
var p = new URLSearchParams(window.location.search);
var c = p.get('code');
if (c) { document.getElementById('msg').textContent = 'Authorization code (copy it exactly and give it to Lucy):'; document.getElementById('code').textContent = c; }
else { document.getElementById('msg').textContent = 'No authorization code was found in this link.'; }
</script>
</body>
</html>
